name: Deploy Spacetime Observatory (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site assets
        run: |
          test -f site/index.html
          test -f site/css/observatory.css
          test -f site/js/cdt.js
          test -f site/js/diffusion.js
          test -f site/js/app.js
          grep -q "SpacetimeCDT" site/js/cdt.js
          grep -q "spectralDimension" site/js/diffusion.js
          grep -q "browser-side" site/index.html
          # Shared combinatorics conventions present
          grep -q "buildFlatCDT" site/js/cdt.js
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          test -f _site/index.html
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # github-pages environment protection allows main only; never deploy from feature branches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
