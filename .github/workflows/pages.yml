name: Observatory site validation

# Validation only. Production deploy is owned by static.yml (publishes site/).
on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatory-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site assets
        run: |
          test -f site/index.html
          test -f site/css/observatory.css
          test -f site/js/cdt.js
          test -f site/js/diffusion.js
          test -f site/js/app.js
          grep -q "SpacetimeCDT" site/js/cdt.js
          grep -q "spectralDimension" site/js/diffusion.js
          grep -q "browser-side" site/index.html
          grep -q "buildFlatCDT" site/js/cdt.js
      - name: Stage static site (artifact-root check)
        run: |
          mkdir -p _site
          cp -r site/* _site/
          test -f _site/index.html
