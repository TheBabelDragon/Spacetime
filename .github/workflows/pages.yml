name: Deploy Spacetime Observatory (GitHub Pages)

on:
  push:
    branches: [main, feat/v0.2-cdt-ensemble-spectral-engine]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site assets
        run: |
          test -f site/index.html
          test -f site/css/observatory.css
          test -f site/js/cdt.js
          test -f site/js/diffusion.js
          test -f site/js/app.js
          grep -q "SpacetimeCDT" site/js/cdt.js
          grep -q "spectralDimension" site/js/diffusion.js
          grep -q "browser-side" site/index.html
      - name: Stage Pages artifact
        run: |
          mkdir -p _site
          cp -r site/* _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
