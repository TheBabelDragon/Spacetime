# Deploy Spacetime Observatory static content to GitHub Pages
# Artifact root MUST be site/ so index.html is at the Pages root.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Observatory entrypoint
        run: |
          test -f site/index.html
          test -f site/css/observatory.css
          test -f site/js/cdt.js
          test -f site/js/diffusion.js
          test -f site/js/app.js
          test -f site/js/ensemble.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
