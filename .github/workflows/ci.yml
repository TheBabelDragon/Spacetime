name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

      - name: Observatory asset smoke
        run: |
          test -f site/index.html
          test -f site/css/observatory.css
          test -f site/js/cdt.js
          test -f site/js/diffusion.js
          test -f site/js/app.js
          test -f site/js/ensemble.js
          node --check site/js/cdt.js
          node --check site/js/diffusion.js
          node --check site/js/ensemble.js
          node --check site/js/app.js
